<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AUX2 3D Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-top: #6399ac;
    --bg-bottom: #3a697d;
    --fg: #ffffff;
    --muted: rgba(255, 255, 255, 0.62);
    --dim: rgba(255, 255, 255, 0.42);
    --rule: rgba(255, 255, 255, 0.26);
    --pad-x: clamp(24px, 8vw, 168px);
    --blue: #0f62d0;
    --blue-light: #5d9cf0;
    --card-top: #2f3b4b;
    --card-bottom: #3a404c;
  }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden; color: var(--fg);
    font-family: Figtree, system-ui, sans-serif;
    background: linear-gradient(var(--bg-top), var(--bg-bottom)) fixed;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- 3D stage + leader lines ---- */
  #stage { position: fixed; inset: 0; z-index: 0; }
  .intro, .features { z-index: 2; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #leaders { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  #leaders .hit { fill: transparent; pointer-events: auto; cursor: pointer; }

  /* ---- intro ---- */
  .intro { position: fixed; top: clamp(28px, 10vh, 120px); left: var(--pad-x); max-width: min(640px, 52vw); pointer-events: none; }
  .intro h1 { margin: 0 0 0.4em; font-weight: 600; font-size: clamp(34px, 3.8vw, 64px); line-height: 1.05; letter-spacing: -0.03em; }
  .intro p { margin: 0; font-size: clamp(16px, 1.45vw, 22px); line-height: 1.4; color: var(--muted); }

  /* ---- feature cards ---- */
  .features {
    position: fixed; right: clamp(20px, 4vw, 96px); top: clamp(120px, 22vh, 280px); bottom: 0;
    width: min(440px, 33vw); margin: 0; padding: 4px 4px 48px; list-style: none; box-sizing: border-box;
    overflow-y: auto; scrollbar-width: none;
    -webkit-mask-image: linear-gradient(#000 calc(100% - 48px), transparent);
    mask-image: linear-gradient(#000 calc(100% - 48px), transparent);
  }
  .features::-webkit-scrollbar { display: none; }
  .feature {
    margin-bottom: 12px; border-radius: 22px; overflow: hidden;
    background: linear-gradient(var(--card-top), var(--card-bottom));
    box-shadow: inset 0 1.5px 0 rgba(93, 156, 240, 0.55), 0 8px 24px rgba(10, 30, 45, 0.18);
    opacity: 0.78; transition: opacity .2s, box-shadow .2s;
  }
  .feature:hover, .feature.hover { opacity: 0.92; }
  .feature.active {
    opacity: 1;
    box-shadow: inset 0 0 0 1.5px var(--blue), inset 0 1.5px 0 var(--blue-light), 0 12px 32px rgba(10, 30, 45, 0.3);
  }
  .feature-head {
    all: unset; box-sizing: border-box; width: 100%; cursor: pointer;
    display: grid; grid-template-columns: 44px 1fr; gap: 16px; align-items: start;
    padding: 20px 22px 20px 20px;
  }
  .feature-head:focus-visible { outline: 2px solid #fff; outline-offset: -4px; border-radius: 22px; }
  .feature-icon {
    width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; box-sizing: border-box;
    border: 1.5px solid #24569a; background: rgba(8, 24, 48, 0.35); color: #fff;
  }
  .feature.active .feature-icon { border-color: var(--blue-light); background: rgba(15, 98, 208, 0.25); }
  .feature-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .feature-title { display: block; padding-top: 9px; font-weight: 500; font-size: clamp(18px, 1.5vw, 22px); line-height: 1.2; color: #fff; }
  .feature-desc { display: block; margin-top: 8px; font-size: 15px; line-height: 1.45; color: rgba(255, 255, 255, 0.62); }
  .feature-specs { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s ease; }
  .feature.active .feature-specs { grid-template-rows: 1fr; }
  .feature-specs > div { overflow: hidden; }
  .feature-specs dl {
    margin: 0 22px 20px 80px; padding-top: 14px; display: grid; gap: 8px 14px;
    grid-template-columns: minmax(84px, 38%) 1fr; border-top: 1px solid rgba(255, 255, 255, 0.1);
  }
  .feature-specs dl > div { display: contents; }
  .feature-specs dt { font-size: 13px; line-height: 1.4; color: rgba(255, 255, 255, 0.5); }
  .feature-specs dd { margin: 0; font-size: 13.5px; line-height: 1.4; color: rgba(255, 255, 255, 0.9); }
  .feature-specs .note { grid-column: 1 / -1; font-size: 12.5px; color: rgba(255, 255, 255, 0.5); }

  /* ---- tools ---- */
  .tools { position: fixed; left: var(--pad-x); bottom: 22px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .tools button {
    font: 500 13px/1 Figtree, system-ui, sans-serif; color: #fff; cursor: pointer;
    background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 999px; padding: 8px 13px;
  }
  .tools button:hover { background: rgba(255, 255, 255, 0.2); }
  .tools button[aria-pressed="true"] { background: #fff; color: #2f5d70; }
  .tools .hint { font-size: 12.5px; color: var(--muted); margin-left: 6px; }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 14px; color: #fff; }

  /* ---- small screens: intro, sticky model, list below; dots instead of leader lines ---- */
  @media (max-width: 899px) {
    html, body { height: auto; }
    body { overflow: auto; }
    .intro { position: static; max-width: none; padding: 28px 16px 12px; }
    #stage { position: sticky; top: 0; height: max(300px, 46vh); z-index: 1; }
    .features { position: static; width: auto; padding: 20px 16px 48px; overflow: visible; -webkit-mask-image: none; mask-image: none; }
    .feature-specs dl { margin-left: 22px; }
    .tools { position: absolute; left: 16px; bottom: 10px; }
    .tools .hint { display: none; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.7/build/index.module.js",
    "three-bvh-csg": "https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.18/build/index.module.js"
  }
}
</script>
</head>
<body>
<header class="intro">
  <h1>Connect everything</h1>
  <p>Stream audio, control legacy devices over RS-232, add sensors and extend your Zigbee or Z-Wave network, all from one small box.</p>
</header>
<div id="stage">
  <svg id="leaders" aria-hidden="true"></svg>
  <div class="tools">
    <button id="spin" aria-pressed="false">Rotate</button>
    <button id="export">Export GLB</button>
    <span class="hint">Drag to rotate · scroll to zoom</span>
  </div>
</div>
<ol class="features" id="features" aria-label="Ports and capabilities"></ol>
<div id="loading">Building model…</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';
import { Brush, Evaluator, SUBTRACTION } from 'three-bvh-csg';

// ---------------------------------------------------------------------------
// Dimensions (mm). Scale derived from the straight-on photo: RJ45 jack = 16 mm.
// ---------------------------------------------------------------------------
const W = 100;      // width  (x)
const D = 64;       // depth  (z)
const H = 24;       // shell height (y), excluding feet
const R = 8.5;      // plan-view corner radius
const EDGE = 1.4;   // top/bottom edge rounding
const WALL = 1.6;   // shell wall thickness
const CAP_INSET = 1.7;  // frosted rim around the white top
const CAP_T = 2.0;      // white top thickness
const FOOT_H = 1.2;
const BASE = FOOT_H;    // shell bottom sits on the feet

// ---------------------------------------------------------------------------
// Renderer / scene
// ---------------------------------------------------------------------------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;

// Screen-space gradient matching the page background (a real background is
// needed so the frosted transmission has something to refract).
{
  const css = getComputedStyle(document.documentElement);
  const c = Object.assign(document.createElement('canvas'), { width: 2, height: 256 });
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, css.getPropertyValue('--bg-top').trim());
  grad.addColorStop(1, css.getPropertyValue('--bg-bottom').trim());
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 2, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
}

const camera = new THREE.PerspectiveCamera(30, 1, 1, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 60;
controls.maxDistance = 900;
controls.maxPolarAngle = Math.PI * 0.495;

const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(-40, 260, 60);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -120, right: 120, top: 120, bottom: -120, near: 50, far: 600 });
key.shadow.radius = 14;
key.shadow.blurSamples = 16;
key.shadow.bias = -0.0004;
scene.add(key);
const fill = new THREE.DirectionalLight(0xdfefff, 0.6);
fill.position.set(160, 80, -120);
scene.add(fill);

// invisible floor that only catches the shadow
const floor = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.ShadowMaterial({ opacity: 0.16 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// bloom only catches the port glow: everything else stays below the threshold
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.7, 0.5, 2.2);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------------------------------------------------------------------------
// Materials
// ---------------------------------------------------------------------------
const M = {
  frosted: new THREE.MeshPhysicalMaterial({
    color: 0xdfe6ee, roughness: 0.62, transmission: 0.85, thickness: 3, ior: 1.46,
    attenuationColor: new THREE.Color(0xc9d6e2), attenuationDistance: 18,
    clearcoat: 0.15, clearcoatRoughness: 0.5,
  }),
  cap: new THREE.MeshPhysicalMaterial({ color: 0xe4e4e2, roughness: 0.6 }),
  metal: new THREE.MeshStandardMaterial({ color: 0xc8ccd1, metalness: 1, roughness: 0.28 }),
  gold: new THREE.MeshStandardMaterial({ color: 0xd8b56a, metalness: 1, roughness: 0.3 }),
  black: new THREE.MeshStandardMaterial({ color: 0x18191b, roughness: 0.55 }),
  void: new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 1 }),
  green: new THREE.MeshStandardMaterial({ color: 0x7fd99c, roughness: 0.45 }),
  grove: new THREE.MeshStandardMaterial({ color: 0xe8d9bb, roughness: 0.6 }),
  ledY: new THREE.MeshStandardMaterial({ color: 0xffd23a, emissive: 0xffb300, emissiveIntensity: 0.6, roughness: 0.3 }),
  ledG: new THREE.MeshStandardMaterial({ color: 0x7fe05a, emissive: 0x4bd12a, emissiveIntensity: 0.6, roughness: 0.3 }),
  pcb: new THREE.MeshStandardMaterial({ color: 0x6f787f, roughness: 0.8 }),
  internal: new THREE.MeshStandardMaterial({ color: 0x7d868d, roughness: 0.7 }),
  foot: new THREE.MeshStandardMaterial({ color: 0xdfe5ea, roughness: 0.8, transparent: true, opacity: 0.9 }),
  dot: new THREE.MeshBasicMaterial({ color: 0xf4f7f9 }),
};

// ---------------------------------------------------------------------------
// Geometry helpers
// ---------------------------------------------------------------------------
function roundedRect(w, h, r, shape = new THREE.Shape()) {
  const x = -w / 2, y = -h / 2;
  r = Math.min(r, w / 2, h / 2);
  shape.moveTo(x + r, y);
  shape.lineTo(x + w - r, y);
  shape.absarc(x + w - r, y + r, r, -Math.PI / 2, 0);
  shape.lineTo(x + w, y + h - r);
  shape.absarc(x + w - r, y + h - r, r, 0, Math.PI / 2);
  shape.lineTo(x + r, y + h);
  shape.absarc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
  shape.lineTo(x, y + r);
  shape.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
  return shape;
}
const roundedRectPath = (w, h, r) => roundedRect(w, h, r, new THREE.Path());
const stadium = (w, h, shape) => roundedRect(w, h, h / 2, shape);
const circle = (r, shape = new THREE.Shape()) => { shape.absarc(0, 0, r, 0, Math.PI * 2); return shape; };

// Rounded slab lying flat (plan = w × d), spanning y ∈ [0, h], with edge rounding e.
function plateGeo(w, d, h, r, e = 0, segs = 8) {
  const shape = roundedRect(w - 2 * e, d - 2 * e, Math.max(r - e, 0.01));
  const g = new THREE.ExtrudeGeometry(shape, {
    depth: h - 2 * e, curveSegments: 24,
    bevelEnabled: e > 0, bevelThickness: e, bevelSize: e, bevelSegments: segs,
  });
  g.rotateX(-Math.PI / 2);
  g.translate(0, e, 0);
  return g;
}

// Extrude a 2D profile (in the face plane) from z=z0 back to z=z0-depth.
function prism(shape, depth, z0 = 0, curveSegments = 24) {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments });
  g.translate(0, 0, z0 - depth);
  return g;
}

function mesh(geo, mat, { cast = false } = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = cast;
  return m;
}

// Face placement. `d` = mm from the left edge as seen looking at that face,
// `fromTop` = mm down from the shell's top edge.
function faceTransform(obj, face, d, fromTop, out = 0) {
  const y = BASE + H - fromTop;
  if (face === 'front') {
    obj.position.set(-W / 2 + d, y, D / 2 + out);
  } else {
    obj.position.set(W / 2 - d, y, -D / 2 - out);
    obj.rotation.y = Math.PI;
  }
  return obj;
}

// ---------------------------------------------------------------------------
// Labels (canvas textures on thin planes)
// ---------------------------------------------------------------------------
const PX = 48; // canvas px per mm
const FONT = '500 FPXpx Figtree, system-ui, sans-serif';
const textMat = (tex) => new THREE.MeshBasicMaterial({
  map: tex, transparent: true, depthWrite: false, toneMapped: false,
  polygonOffset: true, polygonOffsetFactor: -2, color: 0xffffff,
});

// `lines`: array of strings. Text size is cap-ish height in mm.
function makeLabel(lines, size = 2.1, { draw } = {}) {
  const fpx = Math.round(size * PX);
  const font = FONT.replace('FPX', fpx);
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  ctx.font = font;
  const lineH = fpx * 1.22;
  const widths = lines.map((l) => measureLine(ctx, l, fpx));
  c.width = Math.ceil(Math.max(...widths) + fpx * 0.4);
  c.height = Math.ceil(lineH * lines.length + fpx * 0.2);
  ctx.font = font;
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.strokeStyle = 'rgba(255,255,255,0.92)';
  ctx.textBaseline = 'middle';
  lines.forEach((l, i) => drawLine(ctx, l, (c.width - widths[i]) / 2, lineH * (i + 0.5) + fpx * 0.1, fpx));
  draw?.(ctx, c, fpx);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(c.width / PX, c.height / PX), textMat(tex));
  m.renderOrder = 2;
  return m;
}
// "⎓" (DC) is drawn by hand since most fonts lack it.
const DC = '⎓';
function measureLine(ctx, l, fpx) {
  return l.split(DC).reduce((s, p, i) => s + ctx.measureText(p).width + (i ? fpx * 0.9 : 0), 0);
}
function drawLine(ctx, l, x, y, fpx) {
  l.split(DC).forEach((part, i) => {
    if (i) {
      const w = fpx * 0.9, lw = fpx * 0.09;
      ctx.fillRect(x, y - fpx * 0.12, w, lw);
      for (let k = 0; k < 3; k++) ctx.fillRect(x + k * w / 3 + w * 0.03, y + fpx * 0.1, w / 3 - w * 0.12, lw);
      x += w;
    }
    ctx.fillText(part, x, y);
    x += ctx.measureText(part).width;
  });
}

// ---------------------------------------------------------------------------
// Connectors. Each builder returns { parts: Object3D (local, front plane at z=0,
// extending into -z), hole: BufferGeometry to subtract from the shell }.
// ---------------------------------------------------------------------------
const RECESS = 0.5; // connectors sit slightly behind the outer surface
const HOLE_DEPTH = WALL + 4;
const holeFrom = (shape) => prism(shape, HOLE_DEPTH, 1);

function rj45() {
  const g = new THREE.Group();
  const w = 16, h = 13;
  const can = roundedRect(w, h, 0.4); can.holes.push(roundedRectPath(w - 0.8, h - 0.8, 0.2));
  g.add(mesh(prism(can, 20, -RECESS), M.metal));
  // black insert with plug opening (+ latch notch at the bottom)
  const insert = roundedRect(w - 0.8, h - 0.8, 0.2);
  const open = new THREE.Path();
  open.moveTo(-5.85, -2.4); open.lineTo(-2.9, -2.4); open.lineTo(-2.9, -4.6); open.lineTo(2.9, -4.6);
  open.lineTo(2.9, -2.4); open.lineTo(5.85, -2.4); open.lineTo(5.85, 5.0); open.lineTo(-5.85, 5.0); open.closePath();
  insert.holes.push(open);
  g.add(mesh(prism(insert, 18, -RECESS - 0.6), M.black));
  const back = mesh(new THREE.PlaneGeometry(w, h), M.void); back.position.z = -16; g.add(back);
  for (let i = 0; i < 8; i++) {
    const pin = mesh(new THREE.BoxGeometry(0.45, 0.3, 6), M.gold);
    pin.position.set(-3.15 + i * 0.9, 4.75, -9);
    g.add(pin);
  }
  [[-5.1, M.ledY], [5.1, M.ledG]].forEach(([x, mat]) => {
    const led = mesh(new THREE.BoxGeometry(2.2, 1.3, 0.4), mat);
    led.position.set(x, -4.4, -RECESS - 0.5);
    g.add(led);
  });
  return { parts: g, hole: holeFrom(roundedRect(w + 0.4, h + 0.4, 0.5)) };
}

function usbC() {
  const g = new THREE.Group();
  const shell = stadium(8.94, 3.26); shell.holes.push(stadium(8.34, 2.66, new THREE.Path()));
  g.add(mesh(prism(shell, 7, -RECESS), M.metal));
  const tongue = mesh(new THREE.BoxGeometry(6.6, 0.7, 5), M.black); tongue.position.z = -RECESS - 1.4 - 2.5; g.add(tongue);
  const back = mesh(new THREE.PlaneGeometry(9, 3.4), M.void); back.position.z = -7; g.add(back);
  return { parts: g, hole: holeFrom(stadium(9.7, 4.0)) };
}

function usbA() {
  const g = new THREE.Group();
  const shell = roundedRect(13.15, 5.8, 0.4); shell.holes.push(roundedRectPath(12.5, 5.12, 0.2));
  g.add(mesh(prism(shell, 14, -RECESS), M.metal));
  const tongue = mesh(new THREE.BoxGeometry(11, 1.9, 12), M.black); tongue.position.set(0, 1.3, -RECESS - 1.0 - 6); g.add(tongue);
  for (let i = 0; i < 4; i++) {
    const c = mesh(new THREE.BoxGeometry(1.0, 0.15, 6), M.gold);
    c.position.set(-3.75 + i * 2.5, 0.3, -RECESS - 4);
    g.add(c);
  }
  const back = mesh(new THREE.PlaneGeometry(13, 5.8), M.void); back.position.z = -13; g.add(back);
  return { parts: g, hole: holeFrom(roundedRect(13.7, 6.4, 0.6)) };
}

function jack35(ringMat = M.black) {
  const g = new THREE.Group();
  const ring = circle(3.0); ring.holes.push(circle(1.75, new THREE.Path()));
  g.add(mesh(prism(ring, 1.2, -RECESS), ringMat));
  const body = circle(3.0); body.holes.push(circle(1.75, new THREE.Path()));
  g.add(mesh(prism(body, 10, -RECESS - 1.2), M.black));
  const back = mesh(new THREE.CircleGeometry(1.8, 24), M.void); back.position.z = -8; g.add(back);
  return { parts: g, hole: holeFrom(circle(3.3)) };
}

function grove() {
  const g = new THREE.Group();
  const housing = roundedRect(9.6, 5.4, 0.3);
  housing.holes.push(roundedRectPath(8.0, 2.4, 0.2));
  g.add(mesh(prism(housing, 6, -RECESS - 0.3), M.grove));
  const slot = mesh(new THREE.PlaneGeometry(8, 2.4), M.void); slot.position.z = -5.5; g.add(slot);
  for (let i = 0; i < 4; i++) {
    const p = mesh(new THREE.BoxGeometry(0.5, 0.5, 4), M.gold);
    p.position.set(-3 + i * 2, 0, -5);
    g.add(p);
  }
  const latch = mesh(new THREE.BoxGeometry(3.6, 1.0, 0.6), M.grove); latch.position.set(0, -2.2, -RECESS - 0.1); g.add(latch);
  return { parts: g, hole: holeFrom(roundedRect(10.2, 6.0, 0.5)) };
}

function resetHole() {
  const g = new THREE.Group();
  const tube = circle(0.95); tube.holes.push(circle(0.75, new THREE.Path()));
  g.add(mesh(prism(tube, 3, -0.2), M.void));
  const back = mesh(new THREE.CircleGeometry(0.9, 20), M.void); back.position.z = -2.5; g.add(back);
  return { parts: g, hole: holeFrom(circle(0.95)) };
}

// ---------------------------------------------------------------------------
// Layout (measured from the photos)
// ---------------------------------------------------------------------------
const PORTS = [
  // front: Reset · USB-C · RJ45
  { id: 'reset', face: 'front', d: 41.3, top: 14.1, make: resetHole, label: ['Reset'], lTop: 9.4 },
  { id: 'usbc', face: 'front', d: 54.8, top: 16.3, make: usbC, label: ['USB-C', `5V ${DC} 2A`], lTop: 9.5 },
  { id: 'rj45', face: 'front', d: 72.8, top: 12.2, make: rj45 },
  { face: 'front', label: ['PoE', '802.3af'], d: 86.8, lTop: 9.9 },
  // back: USB-A · RS-232 Port 1/2 · Grove · Audio
  { id: 'usba', face: 'back', d: 38.5, top: 13.6, make: usbA, label: ['USB-A'], lTop: 8.0 },
  { id: 'port1', face: 'back', d: 52.5, top: 13.6, make: () => jack35(), label: ['Port 1'], lTop: 8.4 },
  { id: 'port2', face: 'back', d: 63.5, top: 13.6, make: () => jack35(), label: ['Port 2'], lTop: 8.4 },
  { id: 'grove', face: 'back', d: 76.0, top: 14.2, make: grove, label: ['Grove Port'], lTop: 8.4 },
  { id: 'audio', face: 'back', d: 88.0, top: 14.2, make: () => jack35(M.green), label: ['Audio'], lTop: 8.4 },
];

// Connector outlines (w, h, corner r) used for the light-pipe ring behind each port.
const GLOW_SHAPES = {
  reset: [1.9, 1.9, 0.95], usbc: [8.94, 3.26, 1.63], rj45: [16, 13, 0.4],
  usba: [13.15, 5.8, 0.4], port1: [6, 6, 3], port2: [6, 6, 3], grove: [9.6, 5.4, 0.3], audio: [6, 6, 3],
};
const GLOW_COLOR = new THREE.Color(0x2f7bff);
const GLOW_GAIN = 30;       // emissive strength at full glow (HDR, feeds the bloom)
const LIGHT_MAX = 700;      // point-light intensity (candela, mm scene units)
const GLOWS = {};           // id → { mat, light, level, target }

// A glowing ring just inside the wall around the port + a point light behind it.
function portGlow(id) {
  const [w, h, r] = GLOW_SHAPES[id];
  const g = new THREE.Group();
  // inner edge sits outside the shell opening, so the light is only seen diffused through the plastic
  const ring = roundedRect(w + 9, h + 9, r + 4.5);
  ring.holes.push(roundedRectPath(w + 1.8, h + 1.8, r + 0.9));
  const mat = new THREE.MeshStandardMaterial({ color: 0x9aa3aa, roughness: 0.7, emissive: GLOW_COLOR, emissiveIntensity: 0 });
  g.add(mesh(prism(ring, 0.3, -WALL - 0.05), mat));
  const light = new THREE.PointLight(GLOW_COLOR, 0, 38, 2);
  // just above the connector body (not inside its metal shell), close behind the wall
  light.position.set(0, h / 2 + 3, -WALL - 2.5);
  g.add(light);
  GLOWS[id] = { mat, light, level: 0, target: 0 };
  return g;
}

// ---------------------------------------------------------------------------
// Build
// ---------------------------------------------------------------------------
async function build() {
  await document.fonts.load('500 40px Figtree').catch(() => {});

  const device = new THREE.Group();
  device.name = 'AUX2';

  // --- frosted shell via CSG ---
  const ev = new Evaluator();
  ev.attributes = ['position', 'normal'];
  ev.useGroups = false;

  const strip = (g) => { g.deleteAttribute('uv'); return g; };
  let outerGeo = strip(plateGeo(W, D, H, R, EDGE, 8));
  outerGeo = toCreasedNormals(outerGeo, Math.PI / 5);
  let shell = new Brush(outerGeo);
  shell.position.y = BASE;
  shell.updateMatrixWorld();

  const sub = (geo, setup) => {
    const b = new Brush(strip(geo));
    setup?.(b);
    b.updateMatrixWorld();
    shell = ev.evaluate(shell, b, SUBTRACTION);
  };
  // hollow interior
  sub(plateGeo(W - 2 * WALL, D - 2 * WALL, H - WALL - CAP_T - 0.6, R - WALL), (b) => (b.position.y = BASE + WALL));
  // recess for the white top
  sub(plateGeo(W - 2 * CAP_INSET + 0.1, D - 2 * CAP_INSET + 0.1, CAP_T + 2, R - CAP_INSET), (b) => (b.position.y = BASE + H - CAP_T));

  const internals = new THREE.Group();
  for (const p of PORTS) {
    if (!p.make) continue;
    const { parts, hole } = p.make();
    sub(hole, (b) => faceTransform(b, p.face, p.d, p.top));
    internals.add(faceTransform(parts, p.face, p.d, p.top));
    if (GLOW_SHAPES[p.id]) internals.add(faceTransform(portGlow(p.id), p.face, p.d, p.top));
  }
  // radio: a glowing antenna strip inside the right-hand end, shining through the end wall
  {
    const mat = new THREE.MeshStandardMaterial({ color: 0x9aa3aa, roughness: 0.7, emissive: GLOW_COLOR, emissiveIntensity: 0 });
    const antenna = mesh(new THREE.BoxGeometry(0.6, 7, 18), mat);
    antenna.position.set(W / 2 - WALL - 1.2, BASE + 12, -6);
    const light = new THREE.PointLight(GLOW_COLOR, 0, 38, 2);
    light.position.set(W / 2 - 10, BASE + 13, -6);
    internals.add(antenna, light);
    GLOWS.radio = { mat, light, level: 0, target: 0 };
  }

  shell.material = M.frosted;
  shell.castShadow = true;
  shell.name = 'shell';
  device.add(shell);

  // --- white top ---
  const cap = mesh(plateGeo(W - 2 * CAP_INSET, D - 2 * CAP_INSET, CAP_T, R - CAP_INSET, 0.35, 4), M.cap, { cast: true });
  cap.position.y = BASE + H - CAP_T - 0.03;
  cap.name = 'top';
  device.add(cap);

  // --- internals faintly visible through the frosted shell ---
  const pcb = mesh(new THREE.BoxGeometry(W - 8, 1.6, D - 8), M.pcb);
  pcb.position.y = BASE + 4.5;
  internals.add(pcb);
  const blocks = [
    // [x, z, w, h, d] — rough component volumes
    [-28, 18, 30, 9, 20],
    [-30, -14, 26, 6, 22],
    [5, 0, 18, 3, 18],
  ];
  for (const [x, z, w, h, d] of blocks) {
    const b = mesh(new THREE.BoxGeometry(w, h, d), M.internal);
    b.position.set(x, BASE + 5.3 + h / 2, z);
    internals.add(b);
  }
  internals.name = 'internals';
  device.add(internals);

  // --- labels & indicator dots ---
  const OUT = 0.03;
  for (const p of PORTS) {
    if (p.label) device.add(faceTransform(makeLabel(p.label), p.face, p.d, p.lTop, OUT));
  }
  // RS-232 heading spanning both serial ports, with rules either side
  const rs = makeLabel(['RS-232']);
  device.add(faceTransform(rs, 'back', 58, 5.0, OUT));
  for (const [d0, d1] of [[47.3, 54.2], [61.8, 68.7]]) {
    const rule = mesh(new THREE.PlaneGeometry(d1 - d0, 0.14), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85, toneMapped: false }));
    rule.renderOrder = 2;
    device.add(faceTransform(rule, 'back', (d0 + d1) / 2, 4.6, OUT));
  }
  // small light-pipe dots below each connector
  const dots = [
    ['front', 41.3, 17.3], ['front', 50.9, 19.6], ['front', 65.6, 19.6],
    ['back', 32.6, 18.0], ['back', 50.5, 18.2], ['back', 61.5, 18.2], ['back', 71.6, 18.6], ['back', 86.2, 18.6],
  ];
  for (const [face, d, t] of dots) {
    device.add(faceTransform(mesh(new THREE.CircleGeometry(0.28, 16), M.dot), face, d, t, OUT));
  }

  // --- feet ---
  const footGeo = new THREE.CylinderGeometry(2.6, 2.8, FOOT_H, 24);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const f = mesh(footGeo, M.foot);
    f.position.set(sx * (W / 2 - 7), FOOT_H / 2, sz * (D / 2 - 7));
    device.add(f);
  }

  scene.add(device);
  document.getElementById('loading').remove();
  return device;
}

// ---------------------------------------------------------------------------
// Features: copy, specs, which ports they point at, and the camera view
// ---------------------------------------------------------------------------
const FEATURES = [
  {
    id: 'audio', title: 'Stream audio', anchors: ['audio'], view: 'back',
    desc: 'Analogue and digital audio through one 3.5 mm jack, with optical S/PDIF built in.',
    specs: [
      ['DAC', 'TI PCM5122'],
      ['Analogue', '24-bit / 48 kHz stereo, 100 dB SNR'],
      ['Digital', '24-bit / 48 kHz stereo PCM, lossless (S/PDIF)'],
      ['Codecs', 'FLAC, MP3 and WAV'],
      ['Home Assistant', 'Announcements, radio, URL streams and files from your media library'],
      ['Whole-home audio', 'Synchronized playback with Music Assistant via Sendspin'],
    ],
  },
  {
    id: 'sensors', title: 'Connect sensors', anchors: ['grove'], view: 'back',
    desc: 'Plug in sensors easily via the Grove port.',
  },
  {
    id: 'serial', title: 'Serial ports', anchors: ['port1', 'port2'], view: 'back',
    desc: 'Control older devices like TVs, amplifiers and projectors over RS-232.',
    specs: [
      ['Connector', '2 × 3.5 mm RS-232'],
      ['TX / RX switches', 'Swap the transmit and receive lines on each port for extra compatibility'],
      ['Works with', 'Consumer and pro AV equipment, TVs, UPSs, climate controllers'],
    ],
    note: 'Some devices need a converter cable (DB9, RJ9, RJ44, Mini-DIN).',
  },
  {
    id: 'network', title: 'Extend your network', anchors: ['usba'], view: 'back',
    desc: 'Connect your ZBT-2 or ZWA-2 and place it in the optimal location for better coverage.',
    specs: [['USB-A', 'Data, for Connect ZBT-1, ZBT-2 and ZWA-2']],
  },
  {
    id: 'wireless', title: 'Wi-Fi & Bluetooth', anchors: ['radio'], view: 'top',
    desc: 'Connect your Bluetooth devices to Home Assistant.',
    specs: [['SoC', 'ESP32-S3'], ['Wireless', 'Wi-Fi and Bluetooth']],
  },
  {
    id: 'power', title: 'Power & Ethernet', anchors: ['usbc', 'rj45'], view: 'front',
    desc: 'A single cable with Power-over-Ethernet, or power over USB-C.',
    specs: [
      ['USB-C', '5 V DC, 2 A or higher'],
      ['Power-over-Ethernet', 'IEEE 802.3af'],
      ['Ethernet without PoE', 'Requires USB-C power'],
    ],
  },
];

const ICONS = {
  audio: '<path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5M18 7a7 7 0 0 1 0 10"/>',
  sensors: '<path d="M14 14.5V5a2 2 0 0 0-4 0v9.5a4 4 0 1 0 4 0z"/><path d="M12 9v6.5"/>',
  serial: '<rect x="3" y="7" width="18" height="10" rx="3"/><path d="M7.5 10.5h.01M10.5 10.5h.01M13.5 10.5h.01M16.5 10.5h.01M9 13.5h.01M12 13.5h.01M15 13.5h.01" stroke-width="2.4"/>',
  network: '<circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M8 6h8M7 7.8l4 8.4M17 7.8l-4 8.4"/>',
  wireless: '<path d="M7 7l10 10-5 5V2l5 5L7 17"/>',
  power: '<path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2z"/>',
};
// short names for the pill labels at each port
const PORT_LABELS = { audio: 'Audio', grove: 'Grove', port1: 'Port 1', port2: 'Port 2', usba: 'USB-A', radio: 'Wi-Fi · BT', usbc: 'USB-C', rj45: 'PoE' };

// 3D anchor points (just proud of each port) + outward normals for visibility
const ANCHORS = {};
for (const p of PORTS) {
  if (!p.id) continue;
  const o = faceTransform(new THREE.Object3D(), p.face, p.d, p.top, 0.4);
  ANCHORS[p.id] = { pos: o.position.clone(), normal: new THREE.Vector3(0, 0, p.face === 'front' ? 1 : -1) };
}
ANCHORS.radio = { pos: new THREE.Vector3(28, BASE + H + 0.05, -6), normal: new THREE.Vector3(0, 1, 0) };

// ---------------------------------------------------------------------------
// Feature list (DOM)
// ---------------------------------------------------------------------------
const list = document.getElementById('features');
const SVG = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('leaders');
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };

const svgEl = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  parent?.append(e);
  return e;
};

for (const f of FEATURES) {
  const li = el('li', 'feature');
  const head = el('button', 'feature-head');
  head.setAttribute('aria-expanded', 'false');
  const icon = el('span', 'feature-icon');
  icon.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[f.id]}</svg>`;
  const text = el('span');
  text.append(el('span', 'feature-title', f.title), el('span', 'feature-desc', f.desc));
  head.append(icon, text);
  li.append(head);
  if (f.specs || f.note) {
    const wrap = el('div', 'feature-specs'), inner = el('div'), dl = el('dl');
    for (const [k, v] of f.specs || []) {
      const row = el('div');
      row.append(el('dt', '', k), el('dd', '', v));
      dl.append(row);
    }
    if (f.note) dl.append(el('dd', 'note', f.note));
    inner.append(dl); wrap.append(inner); li.append(wrap);
  }
  head.addEventListener('click', () => select(f.id, true));
  li.addEventListener('mouseenter', () => setHover(f.id, true));
  li.addEventListener('mouseleave', () => setHover(f.id, false));
  list.append(li);

  // invisible click targets over each port
  f.hits = f.anchors.map(() => {
    const hit = svgEl('circle', { class: 'hit', r: 14 }, svg);
    hit.addEventListener('click', () => select(f.id, true));
    hit.addEventListener('mouseenter', () => setHover(f.id, true));
    hit.addEventListener('mouseleave', () => setHover(f.id, false));
    return hit;
  });
  Object.assign(f, { li, head });
}

let hoverId = null;
function setHover(id, on) {
  FEATURES.find((x) => x.id === id).li.classList.toggle('hover', on);
  hoverId = on ? id : hoverId === id ? null : hoverId;
  updateGlowTargets();
}

// selected feature's ports glow fully, hovered ones get a preview
function updateGlowTargets() {
  for (const g of Object.values(GLOWS)) g.target = 0;
  const set = (fid, v) => { for (const a of FEATURES.find((x) => x.id === fid)?.anchors || []) if (GLOWS[a]) GLOWS[a].target = Math.max(GLOWS[a].target, v); };
  if (hoverId) set(hoverId, 0.4);
  if (activeId) set(activeId, 1);
}

let activeId = null;
function select(id, move) {
  activeId = id;
  for (const f of FEATURES) {
    const on = f.id === id;
    f.li.classList.toggle('active', on);
    f.head.setAttribute('aria-expanded', on);
  }
  updateGlowTargets();
  if (move) {
    // only turn the device if this feature's ports aren't already facing the viewer
    const f = FEATURES.find((x) => x.id === id);
    if (!f.anchors.every((a) => facing(ANCHORS[a]) > 0.5)) goTo(f.view);
    // once the specs have expanded, make sure the whole item is visible in the list
    if (isWide) setTimeout(() => f.li.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 400);
  }
}

// ---------------------------------------------------------------------------
// Camera views & framing
// ---------------------------------------------------------------------------
const TARGET = new THREE.Vector3(0, 11, 0);
const VIEWS = {
  back:  new THREE.Vector3(125, 95, -190),
  front: new THREE.Vector3(-125, 95, 190),
  top:   new THREE.Vector3(110, 175, -150),
};
let isWide = true;
// On wide screens the model lives in the left ~60% of the stage (the list takes the rest).
const MODEL_REGION = 0.6;
const fit = () => (isWide ? Math.max(1, 1.5 / (camera.aspect * MODEL_REGION)) : Math.max(0.85, 1.15 / camera.aspect));
const viewPos = (name) => VIEWS[name].clone().sub(TARGET).multiplyScalar(fit()).add(TARGET);

let stageRect = stage.getBoundingClientRect();
function resize() {
  isWide = matchMedia('(min-width: 900px)').matches;
  stageRect = stage.getBoundingClientRect();
  const { width: w, height: h } = stageRect;
  renderer.setSize(w, h, false);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(w, h);
  camera.aspect = w / h;
  // shift the projection so the model sits left of centre, under the heading
  if (isWide) camera.setViewOffset(w, h, w * 0.17, -h * 0.08, w, h);
  else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  // keep the current angle, but re-fit the distance
  const dir = camera.position.clone().sub(TARGET);
  camera.position.copy(TARGET).addScaledVector(dir.normalize(), VIEWS.back.clone().sub(TARGET).length() * fit());
}
addEventListener('resize', resize);
addEventListener('scroll', () => (stageRect = stage.getBoundingClientRect()), { passive: true });

camera.position.copy(VIEWS.back);
controls.target.copy(TARGET);
resize();
controls.update();

let tween = null;
function goTo(name) {
  tween = { from: camera.position.clone(), to: viewPos(name), t: 0 };
}
controls.addEventListener('start', () => (tween = null));

// ---------------------------------------------------------------------------
// Port click targets follow the projected anchors; glow levels ease to target.
// ---------------------------------------------------------------------------
const tmp = new THREE.Vector3();
function toScreen(v) {
  tmp.copy(v).project(camera);
  return { x: (tmp.x + 1) / 2 * stageRect.width, y: (1 - tmp.y) / 2 * stageRect.height };
}
function facing(a) {
  tmp.copy(camera.position).sub(a.pos).normalize();
  return THREE.MathUtils.clamp((a.normal.dot(tmp) - 0.08) * 6, 0, 1);
}

function updateOverlay() {
  for (const f of FEATURES) {
    f.anchors.forEach((id, k) => {
      const p = toScreen(ANCHORS[id].pos);
      f.hits[k].setAttribute('cx', p.x);
      f.hits[k].setAttribute('cy', p.y);
      f.hits[k].style.pointerEvents = facing(ANCHORS[id]) > 0.5 ? 'auto' : 'none';
    });
  }
}

const clock = new THREE.Clock();
function updateGlows() {
  const t = clock.getElapsedTime();
  const breathe = 0.85 + 0.15 * Math.sin(t * 2.4);
  for (const g of Object.values(GLOWS)) {
    g.level += (g.target - g.level) * 0.08;
    const l = g.level * (g.target === 1 ? breathe : 1);
    g.mat.emissiveIntensity = l * GLOW_GAIN;
    g.light.intensity = l * LIGHT_MAX;
  }
}

// ---------------------------------------------------------------------------
// Tools, loop
// ---------------------------------------------------------------------------
const spinBtn = document.getElementById('spin');
spinBtn.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  controls.autoRotateSpeed = 1.5;
  spinBtn.setAttribute('aria-pressed', controls.autoRotate);
});

let device;
document.getElementById('export').addEventListener('click', async () => {
  if (!device) return;
  const glb = await new GLTFExporter().parseAsync(device, { binary: true });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' }));
  a.download = 'aux2.glb';
  a.click();
  URL.revokeObjectURL(a.href);
});

const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
function frame() {
  if (tween) {
    tween.t = Math.min(tween.t + 0.022, 1);
    // turntable move: swing around the vertical axis (shortest way), easing height and distance
    const a = new THREE.Spherical().setFromVector3(tween.from.clone().sub(TARGET));
    const b = new THREE.Spherical().setFromVector3(tween.to.clone().sub(TARGET));
    let dTheta = b.theta - a.theta;
    dTheta = Math.atan2(Math.sin(dTheta), Math.cos(dTheta));
    const k = ease(tween.t);
    const sph = new THREE.Spherical(
      THREE.MathUtils.lerp(a.radius, b.radius, k),
      THREE.MathUtils.lerp(a.phi, b.phi, k),
      a.theta + dTheta * k,
    );
    camera.position.setFromSpherical(sph).add(TARGET);
    if (tween.t >= 1) tween = null;
  }
  controls.update();
  updateGlows();
  composer.render();
  updateOverlay();
}
renderer.setAnimationLoop(frame);

// handy for debugging from the console
window.viewer = { scene, camera, controls, renderer, bloom, select, render: frame };

select(FEATURES[0].id, false);
build().then((d) => (device = d)).catch((e) => {
  document.getElementById('loading').textContent = 'Failed to build model: ' + e.message;
  console.error(e);
});
</script>
